<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Mood — coming soon.</title>
<meta name="description" content="Good Mood is an independent creative studio for film, motion & storytelling. Site launching soon.">
<meta property="og:title" content="Good Mood — coming soon.">
<meta property="og:description" content="An independent creative studio for film, motion & storytelling.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a17a0;
    --bg-grad-1:#2119c4;
    --bg-grad-2:#1a17a0;
    --bg-grad-3:#130f80;
    --text:#f4f8ee;
    --text-dim:#b9c0f0;
    --text-faint:#8089d4;
    --accent:#8ff29f;
    --accent-2:#5fd684;
    --accent-rgb:143, 242, 159;
    --accent-2-rgb:95, 214, 132;
    --line:rgba(244,248,238,0.16);
    --body: 'General Sans', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    overflow-x:hidden;
    position:relative;
    padding:24px;
    text-align:center;
  }
  ::selection{background:var(--accent);color:var(--bg);}
  a{color:inherit;}

  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 90% at 15% 15%, rgba(var(--accent-rgb),0.28), transparent 55%),
      radial-gradient(100% 80% at 85% 90%, rgba(var(--accent-2-rgb),0.35), transparent 55%),
      linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 55%, var(--bg-grad-3) 100%);
    animation:drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:scale(1) translate(0,0);}
    100%{transform:scale(1.08) translate(-1.5%,-2%);}
  }
  @media (prefers-reduced-motion: reduce){ .bg{animation:none;} }

  .content{position:relative;z-index:1;max-width:520px;}

  .logo{
    width:clamp(220px, 42vw, 340px);
    height:auto;
    color:var(--accent);
    margin:0 auto 28px;
    display:block;
  }

  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.08em;color:var(--text-dim);
    border:1px solid var(--line);padding:7px 14px;border-radius:100px;
    margin-bottom:22px;
  }
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  h1{
    font-size:clamp(15px, 2vw, 17px);
    font-weight:500;
    color:var(--text-dim);
    max-width:34ch;
    margin:0 auto 30px;
    line-height:1.5;
  }

  .contact{
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(17px, 2.4vw, 20px);
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .25s;
  }
  .contact:hover{border-color:var(--accent);}

  footer{
    position:relative;z-index:1;
    margin-top:46px;
    font-size:11.5px;
    color:var(--text-faint);
    letter-spacing:.03em;
  }
</style>
</head>
