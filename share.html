<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Mood</title>
<meta name="robots" content="noindex">
<meta name="description" content="Selected work from Good Mood.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<script src="mood.js"></script>
<script src="plans-config.js"></script>
<script src="share.js"></script>
<style>
  :root{
    --bg:#f3ead7;--bg-rgb:243,234,215;--bg-panel:#e3dbc9;--bg-panel-2:#d8d0bf;
    --text:#201f1e;--text-dim:#514f49;--accent:#1a17a0;
    --line:rgba(32,31,30,.18);--line-strong:rgba(32,31,30,.34);
    --font:'General Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font-family:inherit;color:inherit}
  button{border:0;cursor:pointer;background:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  ::selection{background:var(--accent);color:var(--bg)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px}
  @media (max-width:600px){.wrap{padding:0 16px}}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:26px 0 0}
  .bar svg{width:88px;height:auto;color:var(--accent);display:block}
  .bar nav{display:flex;gap:30px}
  .bar nav a{font-size:13px;letter-spacing:.02em;color:var(--text-dim);transition:color .2s}
  .bar nav a:hover{color:var(--text)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s,background .2s,color .2s,border-color .2s}
  .btn.primary{background:var(--accent);color:var(--bg)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.ghost{border:1.5px solid var(--line-strong);color:var(--text)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  :root{--ease:cubic-bezier(.22,.7,.2,1)}
  header.intro{padding:56px 0 28px}
  header.intro h1{font-size:clamp(26px,3.6vw,38px);line-height:1.1;letter-spacing:-.02em;font-weight:700}
  header.intro p{font-size:17px;color:var(--text-dim);white-space:pre-line;max-width:60ch;margin-top:10px}

  /* cards: same look as the homepage grid, category always visible */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:8px;padding-bottom:56px}
  .grid.one{grid-template-columns:1fr;max-width:860px}
  .card{position:relative;overflow:hidden;border-radius:3px;aspect-ratio:16/10;cursor:pointer;background:var(--bg-panel);display:block;width:100%;text-align:left}
  .card-poster{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s var(--ease)}
  .card:hover .card-poster{transform:scale(1.045)}
  .card-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,0) 55%),linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%)}
  .card-cat{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:100px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px)}
  .card-info{position:absolute;left:0;right:0;bottom:0;padding:18px 20px}
  .card-title{font-weight:700;font-size:19px;line-height:1.2;color:#fff}
  .card-meta{font-size:13px;color:rgba(255,255,255,.82);margin-top:4px}
  .card-play{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:transform .3s var(--ease),background .3s}
  .card:hover .card-play{transform:scale(1.08);background:rgba(255,255,255,.15)}
  .card-play svg{width:12px;height:12px;fill:#fff;margin-left:2px}

  footer.simple{border-top:1px solid var(--line);padding:22px 0 40px;font-size:14px;color:var(--text-dim);display:flex;gap:22px;flex-wrap:wrap}
  footer.simple a:hover{color:var(--accent)}
  .empty{padding:20px 0 100px;color:var(--text-dim);font-size:17px}
  .empty a{color:var(--accent)}

  /* lightbox: same as the homepage player */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(var(--bg-rgb),.96);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);padding:40px}
  .lightbox.open{opacity:1;pointer-events:auto}
  .lightbox-panel{max-width:920px;width:100%;transform:translateY(14px);transition:transform .4s var(--ease)}
  .lightbox.open .lightbox-panel{transform:translateY(0)}
  .lightbox-stage{aspect-ratio:16/9;border-radius:3px;overflow:hidden;position:relative;background:#000}
  .lightbox-stage.vertical{aspect-ratio:9/16;height:min(74vh,800px);width:auto;max-width:100%;margin:0 auto}
  .lightbox-stage iframe,.lightbox-stage video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .lx-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .lx-spinner{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:rgba(255,255,255,.85);animation:lxSpin .7s linear infinite}
  @keyframes lxSpin{to{transform:rotate(360deg)}}
  .lx-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .lx-tabs button{font-size:12.5px;color:var(--text-dim);padding:7px 14px;border:1px solid var(--line);border-radius:100px;transition:all .2s var(--ease)}
  .lx-tabs button:hover{border-color:var(--line-strong);color:var(--text)}
  .lx-tabs button.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .lx-tabs .n{font-size:10.5px;opacity:.55;margin-right:7px}
  .lx-sub{font-size:13px;color:var(--text-dim);font-style:italic;margin-top:10px}
  .lx-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-top:20px;gap:20px}
  .lx-cat{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .lx-meta h3{font-weight:700;font-size:26px;line-height:1.15;margin-top:4px}
  .lx-client{color:var(--text-dim);font-size:14px;margin-top:4px}
  .lx-summary{font-size:14px;color:var(--text-dim);max-width:60ch;margin-top:12px}
  .lx-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .25s,transform .25s}
  .lx-close:hover{border-color:var(--text);transform:rotate(90deg)}
  .lx-close svg{width:13px;height:13px;stroke:var(--text);stroke-width:1.6}
  @media (max-width:700px){
    .lightbox{padding:0;align-items:flex-start;overflow-y:auto;background:var(--bg)}
    .lightbox-panel{min-height:100%;padding:58px 0 40px;transform:none!important}
    .lightbox-stage{border-radius:0}
    .lightbox-stage.vertical{height:auto;width:100%;max-width:min(100%,calc(72vh*9/16))}
    .lx-tabs{flex-direction:column;gap:6px;padding:0 16px}
    .lx-tabs button{width:100%;text-align:left;padding:11px 16px;font-size:14px;border-radius:12px}
    .lx-sub,.lx-meta{padding:0 16px}
    .lx-meta h3{font-size:22px}
    .lx-close{position:fixed;top:10px;right:12px;z-index:5;width:40px;height:40px;background:rgba(var(--bg-rgb),.92)}
  }
</style>
</head>

  <div class="bar">
    <a href="index.html" aria-label="Good Mood home"><svg viewBox="0 0 232 109" aria-hidden="true"><use href="#gm-logo-glyph"/></svg></a>
  </div>
  <header class="intro">
    <h1 id="title">Selected work</h1>
    <p id="note" hidden></p>
  </header>
  <main class="grid" id="grid"></main>
  <footer class="simple">
    <a id="mail" href="mailto:michael@goodmood.pics">michael@goodmood.pics</a>
    <a id="book" href="index.html#contact" target="_blank" rel="noopener">Book a call</a>
    <a href="index.html#work">All work</a>
  </footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lx-title">
  <div class="lightbox-panel">
    <div class="lightbox-stage" id="lx-stage"></div>
    <div class="lx-tabs" id="lx-tabs" hidden></div>
    <div class="lx-sub" id="lx-sub" hidden></div>
    <div class="lx-meta">
      <div>
        <div class="lx-cat" id="lx-cat"></div>
        <h3 id="lx-title"></h3>
        <div class="lx-client" id="lx-client"></div>
        <p class="lx-summary" id="lx-summary" hidden></p>
      </div>
      <button class="lx-close" id="lx-close" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg></button>
    </div>
  </div>
</div>

<script>
(async function(){
  const $=id=>document.getElementById(id);
  const q=new URLSearchParams(location.search);
  const forName=(q.get('for')||'').trim().slice(0,80);
  const note=(q.get('note')||'').trim().slice(0,600);
  const keys=(q.get('v')||'').split(',').map(s=>s.trim()).filter(Boolean);
  const cfg=window.PLANS_CONFIG||{};
  if(cfg.booking) $('book').href=cfg.booking;
  if(cfg.email){ $('mail').href='mailto:'+cfg.email; $('mail').textContent=cfg.email; }
  if(forName){ $('title').textContent='For '+forName; document.title='For '+forName+' — Good Mood'; }
  if(note){ $('note').textContent=note; $('note').hidden=false; }

  const grid=$('grid');
  let data;
  try{ data=await (await fetch('data/site-content.json',{cache:'no-cache'})).json(); }
  catch(e){ grid.innerHTML='<p class="empty">Couldn\'t load the work. <a href="index.html#work">See it on the main site</a>.</p>'; return; }
  const byKey=Object.fromEntries(flattenCuts(data).map(c=>[c.key,c]));

  // Group picked cuts by project, keeping the order Michael picked them in
  const groups=[];
  keys.forEach(k=>{
    const c=byKey[k]; if(!c) return;
    let g=groups.find(g=>g.p===c.project);
    if(!g){ g={p:c.project,cuts:[]}; groups.push(g); }
    if(!g.cuts.includes(c.cut)) g.cuts.push(c.cut);
  });
  if(!groups.length){ grid.innerHTML='<p class="empty">This link doesn\'t point to any videos. <a href="index.html#work">See all the work</a>.</p>'; return; }
  if(groups.length===1) grid.classList.add('one');

  const category=p=>p.format || (p.tags||[])[0] || '';
  grid.innerHTML=groups.map((g,i)=>{
    const p=g.p, n=g.cuts.length;
    const poster=p.posterImage||g.cuts[0].posterImage||'';
    return `<button class="card" data-i="${i}" aria-label="Play ${esc(p.title)}, ${esc(category(p))}">
      <div class="card-poster" style="${poster?`background-image:url('${esc(poster)}')`:''}"></div>
      <div class="card-scrim"></div>
      ${category(p)?`<div class="card-cat">${esc(category(p))}</div>`:''}
      <div class="card-play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div>
      <div class="card-info">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-meta">${esc(p.client||'')}${n>1?` · ${n} videos`:''}</div>
      </div>
    </button>`;
  }).join('');

  // Lightbox
  const lb=$('lightbox'), stage=$('lx-stage'), tabs=$('lx-tabs'), sub=$('lx-sub');
  let lastFocus=null;
  function showCut(cut){
    stage.classList.toggle('vertical',!!cut.vertical);
    const src=embedSrc(cut.video);
    stage.innerHTML='<div class="lx-loading"><span class="lx-spinner"></span></div>';
    if(src){
      const f=document.createElement('iframe');
      f.src=src+'&autoplay=1'; f.allow='autoplay; fullscreen; picture-in-picture'; f.allowFullscreen=true;
      f.title=cut.label||'Video';
      f.addEventListener('load',()=>{ const l=stage.querySelector('.lx-loading'); if(l) l.remove(); });
      stage.appendChild(f);
    } else {
      stage.innerHTML=`<video src="${esc(cut.video)}" controls autoplay playsinline></video>`;
    }
    sub.textContent=cut.subtitle||''; sub.hidden=!cut.subtitle;
  }
  function open(i){
    const g=groups[i], p=g.p;
    lastFocus=document.activeElement;
    $('lx-cat').textContent=category(p);
    $('lx-title').textContent=p.title;
    $('lx-client').textContent=p.client||'';
    $('lx-summary').textContent=p.summary||''; $('lx-summary').hidden=!p.summary;
    if(g.cuts.length>1){
      tabs.hidden=false;
      tabs.innerHTML=g.cuts.map((c,ci)=>`<button data-ci="${ci}" class="${ci===0?'active':''}"><span class="n">${ci+1}</span>${esc(c.label||('Video '+(ci+1)))}</button>`).join('');
      tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
        showCut(g.cuts[+b.dataset.ci]);
      }));
    } else { tabs.hidden=true; tabs.innerHTML=''; }
    showCut(g.cuts[0]);
    lb.classList.add('open'); document.body.style.overflow='hidden';
    $('lx-close').focus();
  }
  function close(){
    lb.classList.remove('open'); document.body.style.overflow='';
    stage.innerHTML='';
    if(lastFocus) lastFocus.focus();
  }
  grid.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) open(+c.dataset.i); });
  $('lx-close').addEventListener('click',close);
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&lb.classList.contains('open')) close(); });
})();
</script>
</body>
</html>
